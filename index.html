<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Jobrick — ta veille d'offres, pilotee par toi</title>
  <meta name="description" content="Configure ta veille d'emploi automatique : CV, zones de recherche, canaux de notification.">

  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body class="landing">

  <div class="shape-field" aria-hidden="true">
    <svg class="shape shape--ring" data-shape style="--x:8%; --y:14%; --size:180px;" viewBox="0 0 263 263"><path d="M131.7 262.6C59.6 263.1.5 204.7 0 132.4-.5 60.1 57.8 1 130 .5c72.1-.5 131.2 57.9 131.7 130.2.5 72.3-57.8 131.5-130 132z" fill="currentColor"/><path d="M131.4 217.9c47.5-.3 85.9-39.3 85.6-86.9-.3-47.6-39.2-86.1-86.8-85.8-47.5.3-85.9 39.3-85.6 86.9.3 47.6 39.2 86.1 86.8 85.8z" fill="var(--shape-cutout)"/></svg>
    <svg class="shape shape--triangle" data-shape style="--x:82%; --y:10%; --size:110px;" viewBox="0 0 132 67"><path d="M132.07 66.14 66.03 0 0 66.14h132.07Z" fill="currentColor"/></svg>
    <svg class="shape shape--diamond" data-shape style="--x:88%; --y:62%; --size:130px;" viewBox="0 0 283 284"><path d="M142.9 283.5.9 143.2 141.1.9l142 140.4-140.2 142.2Z" fill="currentColor"/></svg>
    <svg class="shape shape--square" data-shape style="--x:6%; --y:70%; --size:100px;" viewBox="0 0 200 200"><rect x="4" y="4" width="192" height="192" rx="22" fill="currentColor"/></svg>
    <svg class="shape shape--ring shape--small" data-shape style="--x:48%; --y:88%; --size:70px;" viewBox="0 0 263 263"><path d="M131.7 262.6C59.6 263.1.5 204.7 0 132.4-.5 60.1 57.8 1 130 .5c72.1-.5 131.2 57.9 131.7 130.2.5 72.3-57.8 131.5-130 132z" fill="currentColor"/><path d="M131.4 217.9c47.5-.3 85.9-39.3 85.6-86.9-.3-47.6-39.2-86.1-86.8-85.8-47.5.3-85.9 39.3-85.6 86.9.3 47.6 39.2 86.1 86.8 85.8z" fill="var(--shape-cutout)"/></svg>
  </div>

  <div class="landing-card anim-hidden" data-anim>
    <div class="landing-logo">Jobrick</div>
    <h1>Ta veille d'offres,<br>pilotée par toi.</h1>
    <p class="landing-sub">
      Dépose ton CV, pointe tes zones sur la carte, choisis comment être
      prévenu. Le reste tourne tout seul, deux fois par jour.
    </p>

    <button id="btn-google" class="btn-google">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.16.28-1.7V4.97H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.03l2.99-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.97l2.99 2.33C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
      Continuer avec Google
    </button>

    <p id="auth-error" class="auth-error" hidden></p>

    <p class="landing-footnote">
      Connexion Google uniquement pour l'instant. Tes données restent dans
      ton espace, visibles par toi seul.
    </p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/motion.js"></script>
  <script>
    (async () => {
      const { data: { session } } = await window.supabaseClient.auth.getSession();
      if (session) {
        window.location.href = "dashboard.html";
      }
    })();

    document.getElementById("btn-google").addEventListener("click", async () => {
      const errorEl = document.getElementById("auth-error");
      errorEl.hidden = true;
      const { error } = await window.supabaseClient.auth.signInWithOAuth({
        provider: "google",
        options: { redirectTo: window.location.origin + window.location.pathname.replace("index.html", "dashboard.html") }
      });
      if (error) {
        errorEl.textContent = "Connexion impossible : " + error.message;
        errorEl.hidden = false;
      }
    });
  </script>
</body>
</html>
