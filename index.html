<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Jobrick — ta veille d'offres, pilotee par toi</title>
  <meta name="description" content="Configure ta veille d'emploi automatique : CV, zones de recherche, canaux de notification.">

  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body class="landing">

  <div class="landing-card">
    <div class="landing-logo">Jobrick</div>
    <h1>Ta veille d'offres, pilotee par toi</h1>
    <p class="landing-sub">
      Depose ton CV, pointe tes zones sur la carte, choisis comment etre
      prevenu. Le reste tourne tout seul, deux fois par jour.
    </p>

    <button id="btn-google" class="btn-google">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.16.28-1.7V4.97H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.03l2.99-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.97l2.99 2.33C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
      Continuer avec Google
    </button>

    <p id="auth-error" class="auth-error" hidden></p>

    <p class="landing-footnote">
      Connexion Google uniquement pour l'instant. Tes donnees restent dans
      ton espace, visibles par toi seul.
    </p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script>
    (async () => {
      const { data: { session } } = await window.supabaseClient.auth.getSession();
      if (session) {
        window.location.href = "dashboard.html";
      }
    })();

    document.getElementById("btn-google").addEventListener("click", async () => {
      const errorEl = document.getElementById("auth-error");
      errorEl.hidden = true;
      const { error } = await window.supabaseClient.auth.signInWithOAuth({
        provider: "google",
        options: { redirectTo: window.location.origin + window.location.pathname.replace("index.html", "dashboard.html") }
      });
      if (error) {
        errorEl.textContent = "Connexion impossible : " + error.message;
        errorEl.hidden = false;
      }
    });
  </script>
</body>
</html>
