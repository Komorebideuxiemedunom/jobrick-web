<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Jobrick">
  <!--
    La cible du logo, redessinee a la main plutot qu'exportee de lucide : a
    16 px ses traits internes se refermaient sur l'anneau et la cible tournait
    a la tache. Ici l'anneau est plus petit et les quatre traits sortent au
    lieu de rentrer, ce qui laisse le centre vide et lisible.
    Pastille violette et cible lavande, et non l'inverse : un aplat lavande se
    fondrait dans la barre d'onglets claire du navigateur.
  -->
  <rect width="32" height="32" rx="8" fill="#5B3FD4"/>
  <g fill="none" stroke="#EDE9F8" stroke-width="2.8" stroke-linecap="round">
    <circle cx="16" cy="16" r="6.6"/>
    <path d="M16 4.6v2.2M16 27.4v-2.2M4.6 16h2.2M27.4 16h-2.2"/>
  </g>
</svg>
