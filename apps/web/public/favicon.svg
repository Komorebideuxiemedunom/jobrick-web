<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Jobrick">
  <!--
    La cible du logo (le CrosshairIcon de lucide), redessinee a la main : les
    proportions de lucide sont faites pour du 24 px, a taille d'onglet ses
    traits internes se collaient a l'anneau. Ici l'anneau est plus large et les
    traits plus courts, pour garder le centre vide.
    Pastille violette et cible lavande, et non l'inverse : un aplat lavande se
    fondrait dans la barre d'onglets claire du navigateur.
    favicon.ico et apple-touch-icon.png derivent de ce fichier :
      rsvg-convert -w 32 -h 32 favicon.svg   (puis empaquete en .ico 16+32)
      rsvg-convert -w 180 -h 180 <ce fichier sans le rx>  (iOS arrondit lui-meme)
  -->
  <rect width="32" height="32" rx="8" fill="#5B3FD4"/>
  <g fill="none" stroke="#EDE9F8" stroke-width="2.4" stroke-linecap="round">
    <circle cx="16" cy="16" r="9.2"/>
    <path d="M16 6.8v3M16 25.2v-3M6.8 16h3M25.2 16h-3"/>
  </g>
</svg>
